# =============================================================================
# Web-NOCV — Nginx reverse proxy untuk Laravel Octane (FrankenPHP)
#
# Nginx adalah satu-satunya container yang terbuka ke host (port 8080).
# Seluruh request diteruskan ke server Octane di http://app:8000.
#
# File statis (CSS/JS/gambar) TIDAK dilayani nginx, melainkan oleh FrankenPHP
# (Caddy `php_server`) di dalam container app. Alasannya:
#   - `public/storage` adalah symlink buatan `php artisan storage:link` yang
#     dibuat di dalam container, jadi nginx tidak akan menemukannya.
#   - Hanya ada satu sumber kebenaran untuk routing & penyajian file.
# Pola proxy ini mengikuti dokumentasi resmi Laravel Octane:
# https://laravel.com/docs/12.x/octane#serving-your-application-via-nginx
# =============================================================================

upstream octane_backend {
    server app:8000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    charset utf-8;
    server_tokens off;

    # Samakan dengan upload_max_filesize/post_max_size di docker/php/php.ini.
    client_max_body_size 64M;

    # Beri ruang untuk request panjang (mis. generate laporan PDF via dompdf).
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    location / {
        proxy_http_version 1.1;

        # Header yang dibutuhkan agar host/scheme/port terdeteksi benar.
        proxy_set_header Host              $http_host;
        proxy_set_header Scheme            $scheme;
        proxy_set_header SERVER_PORT       $server_port;
        proxy_set_header REMOTE_ADDR       $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # Livewire (WebSocket) dan koneksi keep-alive ke Octane.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass http://octane_backend;
    }

    access_log off;
    error_log /var/log/nginx/error.log warn;
}