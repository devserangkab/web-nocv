; PHP production settings untuk FrankenPHP + Laravel Octane (worker mode)

; --- Resource limits ---------------------------------------------------------
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 60

; --- Keamanan ----------------------------------------------------------------
expose_php = Off

; --- Performa path resolution -------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- OPcache (wajib aktif untuk worker mode) ----------------------------------
opcache.enable = 1
opcache.enable_cli = 1
; Kode tidak pernah berubah di image production -> validasi timestamp tidak perlu
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.jit = tracing
opcache.jit_buffer_size = 32M
opcache.max_wasted_percentage = 10

; --- Keamanan tambahan ----------------------------------------------------------
; Mitigasi CVE-2026-109619 (php2shell): fitur legacy yang jarang dipakai
session.upload_progress.enabled = 0
