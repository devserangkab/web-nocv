; =============================================================================
; Web-NOCV — konfigurasi PHP runtime container (FrankenPHP + Octane)
; =============================================================================

; EGPCS: pastikan variabel environment container masuk ke $_ENV/$_SERVER,
; sehingga Laravel membaca APP_KEY, DB_*, SECURE_KEY tanpa file .env.
; Nilai ini juga yang membuat Octane bisa membaca MAX_REQUESTS/REQUEST_MAX_EXECUTION_TIME.
variables_order = "EGPCS"

expose_php = Off

; Octane menahan aplikasi di memori, jadi beri ruang lebih dari mode klasik.
memory_limit = 512M

; Batas waktu per request diatur Octane lewat config octane.max_execution_time,
; jadi PHP sendiri tidak perlu memotongnya.
max_execution_time = 0
max_input_time = 120

; Sesuaikan bila perlu upload media/dokumen berukuran besar.
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20

date.timezone = UTC
allow_url_fopen = On

; OPcache — untuk local development timestamp tetap divalidasi agar edit kode
; langsung terpakai (worker Octane di-reload oleh --watch).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Sesi file (tidak dipakai bila SESSION_DRIVER=database).
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 7200