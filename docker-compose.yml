# =============================================================================
# Web-NOCV — Docker Compose (local development)
#
# 3 container:
#   - nginx : reverse proxy, satu-satunya yang terbuka ke host.
#             Diakses lewat http://localhost:8080 (port 8080 -> 80).
#   - app   : Laravel 12 + FrankenPHP + Laravel Octane (worker mode).
#             Listen di port 8000, hanya di dalam network Docker (tanpa "ports:").
#             FrankenPHP juga yang melayani file statis & symlink public/storage.
#   - mysql : MySQL 8.4, TIDAK di-expose ke host (tanpa "ports:").
#             Hanya bisa diakses dari container app via hostname "mysql".
#
# Alur request:  host:8080 -> nginx -> app:8000 (Octane/FrankenPHP)
#
# Override opsional (taruh di file .env root project atau environment shell):
#   NOCV_DB_PASSWORD, NOCV_DB_ROOT_PASSWORD, NOCV_APP_KEY, NOCV_SECURE_KEY,
#   NOCV_APP_ENV, NOCV_APP_DEBUG, NOCV_APP_URL, NOCV_RUN_MIGRATIONS,
#   NOCV_APP_OPTIMIZE, NOCV_OCTANE_WATCH, NOCV_OCTANE_WORKERS
#
# Perintah umum:
#   docker compose up -d --build      # build + jalankan
#   docker compose logs -f app        # lihat log Octane
#   docker compose exec app php artisan migrate
#   docker compose exec app php artisan octane:reload   # reload worker
#   docker compose down               # stop (data MySQL tetap di volume)
#   docker compose down -v            # stop + hapus volume (data hilang)
# =============================================================================

name: web-nocv

services:
  # ---------------------------------------------------------------------------
  # Nginx — reverse proxy (satu-satunya port yang terbuka ke host)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: web-nocv-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Konfigurasi proxy (read-only).
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - web-nocv

  # ---------------------------------------------------------------------------
  # Aplikasi Laravel (FrankenPHP + Octane)
  # ---------------------------------------------------------------------------
  app:
    image: web-nocv-app:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-nocv-app
    restart: unless-stopped
    # Tanpa "ports:" — hanya bisa diakses dari network Docker (oleh nginx).
    expose:
      - "8000"
    environment:
      APP_NAME: "Web NOCV"
      APP_ENV: "${NOCV_APP_ENV:-local}"
      # Kunci di bawah hanya untuk local development. Saat deploy ke production,
      # wajib digenerate ulang:
      #   php -r "echo 'base64:'.base64_encode(random_bytes(32)).PHP_EOL;"
      APP_KEY: "${NOCV_APP_KEY:-base64:NpH4Syt+cJoRj4xKFAac5hSmIZcLxBr6K8XOU5cn/7Y=}"
      APP_DEBUG: "${NOCV_APP_DEBUG:-true}"
      APP_URL: "${NOCV_APP_URL:-http://localhost:8080}"
      APP_LOCALE: "id"
      APP_FALLBACK_LOCALE: "en"
      APP_FAKER_LOCALE: "id_ID"
      # Dibaca oleh template Caddyfile Octane.
      APP_BASE_PATH: "/app"
      APP_PUBLIC_PATH: "/app/public"

      # Kunci enkripsi data sensitif (lihat app/Support/SecureCipher.php).
      SECURE_KEY: "${NOCV_SECURE_KEY:-base64:W7k5WsVuGinMJJ4JxuldiwG1jDlFrfTdZB+JrDUpTEA=}"

      LOG_CHANNEL: "stack"
      LOG_STACK: "single"
      LOG_LEVEL: "debug"

      # Database terhubung ke service "mysql" di network internal.
      DB_CONNECTION: "mysql"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_DATABASE: "web_nocv"
      DB_USERNAME: "web_nocv"
      DB_PASSWORD: "${NOCV_DB_PASSWORD:-secret}"

      SESSION_DRIVER: "database"
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "false"

      CACHE_STORE: "database"
      QUEUE_CONNECTION: "database"
      FILESYSTEM_DISK: "local"
      BROADCAST_CONNECTION: "log"
      MAIL_MAILER: "log"
      BCRYPT_ROUNDS: "12"

      # --- Laravel Octane (FrankenPHP) ---
      OCTANE_SERVER: "frankenphp"
      OCTANE_HOST: "0.0.0.0"
      OCTANE_PORT: "8000"
      OCTANE_ADMIN_HOST: "127.0.0.1"
      OCTANE_ADMIN_PORT: "2019"
      # "auto" = jumlah worker mengikuti jumlah CPU container.
      OCTANE_WORKERS: "${NOCV_OCTANE_WORKERS:-auto}"
      OCTANE_MAX_REQUESTS: "500"
      # Wajib false untuk local http://localhost:8080.
      OCTANE_HTTPS: "false"
      # Auto-reload worker saat file berubah (watcher native FrankenPHP).
      # Aktifkan bersamaan dengan bind mount source di blok "volumes" di bawah.
      OCTANE_WATCH: "${NOCV_OCTANE_WATCH:-false}"
      OCTANE_POLL: "false"

      # Perilaku saat container start.
      RUN_MIGRATIONS: "${NOCV_RUN_MIGRATIONS:-true}"
      APP_OPTIMIZE: "${NOCV_APP_OPTIMIZE:-false}"
    volumes:
      # Media/avatar/dokumen yang di-upload tetap ada walau container di-rebuild.
      - app-storage:/app/storage/app

      # --- Opsional: live-reload source (local development) ------------------
      # Buka comment di bawah + set NOCV_OCTANE_WATCH=true, lalu restart.
      # Kode PHP/Blade akan langsung terpakai tanpa rebuild image.
      #
      # Catatan:
      #   - Jangan mount ./vendor dan ./public/build (tidak ada di host) —
      #     biarkan dipakai versi dari image.
      #   - Mount hanya read-only (:ro) supaya container tidak membuat file
      #     milik root di folder host.
      #   - Class baru di app/ tetap butuh rebuild agar masuk classmap
      #     autoloader Composer yang sudah di-optimize.
      #
      # - ./app:/app/app:ro
      # - ./routes:/app/routes:ro
      # - ./config:/app/config:ro
      # - ./database:/app/database:ro
      # - ./resources:/app/resources:ro
      # ----------------------------------------------------------------------
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - web-nocv

  # ---------------------------------------------------------------------------
  # MySQL 8.4 — tanpa "ports:", jadi tidak bisa diakses dari luar Docker.
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: web-nocv-db
    restart: unless-stopped
    # Bila PERLU akses dari host (mis. via TablePlus/DBeaver), buka comment di bawah.
    # Sengaja tidak diaktifkan sesuai permintaan.
    # ports:
    #   - "3307:3306"
    environment:
      MYSQL_DATABASE: "web_nocv"
      MYSQL_USER: "web_nocv"
      MYSQL_PASSWORD: "${NOCV_DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${NOCV_DB_ROOT_PASSWORD:-rootsecret}"
    command:
      # Samakan charset/collation dengan config/database.php.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit_defaults_for_timestamp=1
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - web-nocv

volumes:
  mysql-data:
  app-storage:

networks:
  web-nocv:
    driver: bridge