name: ${COMPOSE_PROJECT_NAME:-nocv}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-nocv}-app
    container_name: ${COMPOSE_PROJECT_NAME:-nocv}-app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    environment:
      APP_NAME: ${APP_NAME:-NOCV}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://nocv.serangkab.go.id}
      APP_KEY: ${APP_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      TZ: ${TZ:-Asia/Jakarta}

      # Port HTTP INTERNAL app — dikunci ke 80 agar selalu cocok dengan central Caddyfile
      APP_PORT: 80

      OCTANE_SERVER: frankenphp
      OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
      OCTANE_WORKERS: ${OCTANE_WORKERS:-2}

      # Central MariaDB — juga dibaca docker/wait-db.php via getenv()
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-central_mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-nocv}
      DB_USERNAME: ${DB_USERNAME:?Isi DB_USERNAME di .env}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}

      # sync selama belum ada container queue worker
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
    volumes:
      - app-storage:/app/storage
      - ./.env:/app/.env:ro
    networks:
      - proxynet
      - dbnet
    healthcheck:
      test: ["CMD", "php", "artisan", "octane:status", "--server=frankenphp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxynet:
    external: true
    name: ${PROXY_NETWORK:-proxy_net}
  dbnet:
    external: true
    name: ${DB_NETWORK:-db_net}

volumes:
  app-storage: