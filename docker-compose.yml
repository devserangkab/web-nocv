# Stack production — Laravel 12 (FrankenPHP worker) + MariaDB
#
# Deploy: docker compose up -d --build
# Akses : https://kitabsuci.serangkab.go.id:${APP_PORT:-9446}
#         LAN-only via static DNS MikroTik; host 80/443 & 3306 dipakai aplikasi lain.
# DB    : Navicat -> <ip-server>:${DB_PORT_HOST:-3307}, user kitabsuci, db tempatcod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tempatcod-app
    container_name: tempatcod-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      APP_NAME: Kitab Suci
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://kitabsuci.serangkab.go.id:${APP_PORT:-9446}
      LOG_LEVEL: error

      # Domain & TLS (dipakai docker/Caddyfile; cert Sectigo di-mount dari server)
      APP_DOMAIN: kitabsuci.serangkab.go.id
      APP_PORT: ${APP_PORT:-9446}
      TLS_CERT: /certs/cert.pem
      TLS_KEY: /certs/key.pem

      OCTANE_SERVER: frankenphp
      OCTANE_MAX_REQUESTS: "500"
      OCTANE_WORKERS: ""   # kosong = auto (mengikuti jumlah CPU)

      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: tempatcod
      DB_USERNAME: kitabsuci
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env server}

      # Belum ada queue worker — hindari job menumpuk
      QUEUE_CONNECTION: sync

      APP_KEY: ${APP_KEY:-}
      TZ: Asia/Jakarta
    ports:
      - "${APP_PORT:-9446}:${APP_PORT:-9446}"
    volumes:
      - app-storage:/app/storage
      - ./.env:/app/.env:ro
      - ./docker/certs:/certs:ro
    healthcheck:
      test: ["CMD", "php", "artisan", "octane:status", "--server=frankenphp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mariadb:
    image: mariadb:11.4
    container_name: tempatcod-mariadb
    restart: unless-stopped
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    environment:
      MARIADB_DATABASE: tempatcod
      MARIADB_USER: kitabsuci
      MARIADB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env server}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Isi MYSQL_ROOT_PASSWORD di .env server}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mariadb-data:
  app-storage:
