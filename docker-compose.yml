# =============================================================================
# Stack production — Laravel 12 (FrankenPHP worker mode) + MariaDB
#
# Jalankan (1 command):  docker compose up -d --build
#
# Akses:  https://noc.serangkab.go.id:9446   (HTTPS, cert Sectigo)
#   Catatan: host 80/443 dipakai stack "bahagia". Akses TANPA :9446 akan
#   mendarat di stack lain — selalu sertakan :9446 (URL tanpa port = tahap
#   ingress kelak).
#
# DB (Navicat dari laptop): host=<ip-server>, port=3307, user=noc, db=tempatcod
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tempatcod-app
    container_name: tempatcod-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # Aplikasi
      APP_NAME: NOC
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://noc.serangkab.go.id:9446
      LOG_LEVEL: error

      # Domain & TLS (dipakai oleh docker/Caddyfile)
      APP_DOMAIN: noc.serangkab.go.id
      TLS_CERT: /certs/cert.pem
      TLS_KEY: /certs/key.pem

      # Octane (FrankenPHP worker mode)
      OCTANE_SERVER: frankenphp
      OCTANE_MAX_REQUESTS: "500"
      OCTANE_WORKERS: ""   # kosong = auto (mengikuti jumlah CPU)

      # Database (mengarah ke service "mariadb" di bawah)
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: tempatcod
      DB_USERNAME: noc
      DB_PASSWORD: ${DB_PASSWORD:?Tulis DB_PASSWORD produksi di .env server}

      # Belum ada service queue worker — hindari job menumpuk tanpa worker
      QUEUE_CONNECTION: sync

      # APP_KEY diinterpolasi dari file .env agar stabil antar restart
      APP_KEY: ${APP_KEY:-}

      TZ: Asia/Jakarta
    ports:
      # Satu pintu — host 80/443 dikuasai stack "bahagia"
      # dalam container tetap: HTTPS 8443 (TLS Sectigo)
      - "9446:8443"
    volumes:
      - app-storage:/app/storage
      # .env produksi (dibaca config:cache di entrypoint; env compose menang)
      - ./.env:/app/.env:ro
      # Sertifikat Sectigo di-mount read-only, tidak pernah masuk image
      - ./docker/certs:/certs:ro
    healthcheck:
      # Pola terbukti bahagiafix: cek state server Octane langsung
      test: ["CMD", "php", "artisan", "octane:status", "--server=frankenphp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mariadb:
    image: mariadb:11.4
    container_name: tempatcod-mariadb
    restart: unless-stopped
    # Expose 3307 untuk Navicat dari laptop (login pakai user 'noc', BUKAN root).
    # Pola bahagia yang lebih aman: 127.0.0.1:3307:3306 + SSH tunnel.
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: tempatcod
      MARIADB_USER: noc
      MARIADB_PASSWORD: ${DB_PASSWORD:?Tulis DB_PASSWORD produksi di .env server}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Tulis MYSQL_ROOT_PASSWORD di .env server}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # Script resmi image mariadb (pola bahagiafix)
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mariadb-data:
  app-storage:
